services:
  - type: web
    name: huduma-smart-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npx playwright install chromium --with-deps
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEBUG_VISIBLE
        value: "false"
      # Optional residential/Kenyan proxy configuration for HEF portal connectivity
      # - key: PROXY_SERVER
      #   value: "http://proxy.example.com:8080"
      # - key: PROXY_USERNAME
      #   value: "proxy_username"
      # - key: PROXY_PASSWORD
      #   value: "proxy_password"
    plan: starter
